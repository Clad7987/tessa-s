<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Galeria com Lazy Load</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .gallery-img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 5px;
    }
    .img-container {
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Galeria de Imagens</h1>
    <div class="row" id="gallery"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('tessa_fowler.json')
        .then(response => response.json())
        .then(imagens => {
          const gallery = document.getElementById('gallery');
          imagens.forEach(src => {
            const col = document.createElement('div');
            col.className = 'col-md-4 img-container';

            const img = document.createElement('img');
            img.src = src.path;
            img.loading = 'lazy'; // lazy load nativo
            img.className = 'gallery-img img-fluid shadow-sm';
            img.alt = src.name

            col.appendChild(img);
            gallery.appendChild(col);
          });
        })
        .catch(err => console.error('Erro ao carregar imagens:', err));
    });
  </script>
</body>
</html>
